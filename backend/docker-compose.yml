services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - C:\Users\ramaa\Downloads:/code/downloads
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xray_db
    ports:
      - "5433:5432"